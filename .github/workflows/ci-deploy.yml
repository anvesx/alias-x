name: CI and deploy

# Pull requests: run typecheck + tests only.
# Push to main (or manual run on main): run tests, then deploy to the GCP VM over SSH.
# One-time VM and secrets setup: see deploy/README.md

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Lets the repo owner require an approval before each deploy (Settings > Environments > production).
    environment: production
    concurrency:
      group: deploy-alias-x
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Build release archive
        run: git archive --format=tar.gz --output=release.tar.gz "$GITHUB_SHA"

      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The VM's deploy key can only run the deploy script. It reads: line 1 = commit SHA, rest = the archive.
          { echo "$GITHUB_SHA"; cat release.tar.gz; } | ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "deploy@$DEPLOY_HOST"
